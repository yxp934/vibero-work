<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Status</title>
    <style>
        :root {
            --page-bg: #f5f5f3;
            --card-bg: #ffffff;
            --text-primary: #1f1f1f;
            --text-secondary: #5f5f5f;
            --border-color: rgba(31, 31, 31, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --page-bg: #171717;
                --card-bg: #232323;
                --text-primary: #f5f5f5;
                --text-secondary: #b1b1b1;
                --border-color: rgba(255, 255, 255, 0.08);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--page-bg);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(480px, 100%);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        p {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .hint {
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main>
        <h1>账户中心已从 AI 工作流解耦</h1>
        <p>当前版本中，AI 对话与论文解析不再依赖登录状态、Credits 查询或账户面板。</p>
        <p>如果后续需要独立的账户管理能力，应通过专门的账户入口实现，而不是作为 AI 运行前置条件。</p>
        <p class="hint">此页面当前仅保留说明用途，不再主动读取 `VibeDBSync` 会话、余额或登录信息。</p>
    </main>
</body>

</html>
