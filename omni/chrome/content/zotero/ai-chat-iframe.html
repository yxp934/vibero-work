<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <script>
        const CUSTOM_AUTO_OPEN_PREF = 'aiChat.customProviderConfigAutoOpen';
        const DEFAULT_PROVIDER_NAME = 'Custom Provider';

        function getHostZotero() {
            return window.parent?.Zotero || window.top?.Zotero || null;
        }

        function ensureAIProvidersRegistry() {
            try {
                const Zotero = getHostZotero();
                if (!Zotero) {
                    return null;
                }
                if (!Zotero.AIProviders && typeof Services !== 'undefined' && Services.scriptloader) {
                    Services.scriptloader.loadSubScript('chrome://zotero/content/xpcom/aiProviders.js', Zotero);
                }
                return Zotero.AIProviders || null;
            } catch (e) {
                console.error('[ZoteroHelper] 加载 AIProviders registry 失败:', e);
                return null;
            }
        }

        function normalizeCustomConfig(rawConfig, requireComplete = false) {
            if (!rawConfig || typeof rawConfig !== 'object') {
                return null;
            }

            const normalized = {
                ...rawConfig,
                name: String(rawConfig.name || '').trim(),
                baseUrl: String(rawConfig.baseUrl || '').trim(),
                apiKey: String(rawConfig.apiKey || '').trim(),
                modelName: String(rawConfig.modelName || rawConfig.model || '').trim()
            };

            if (!normalized.model) {
                normalized.model = normalized.modelName;
            }

            if (requireComplete && (!normalized.name || !normalized.baseUrl || !normalized.apiKey || !normalized.modelName)) {
                return null;
            }

            return normalized;
        }

        function getStoredCustomModelConfig() {
            try {
                const registry = ensureAIProvidersRegistry();
                if (!registry) {
                    return null;
                }
                return normalizeCustomConfig(registry.getDefaultProvider(), false);
            } catch (e) {
                console.error('[ZoteroHelper] 读取自定义模型配置失败:', e);
                return null;
            }
        }

        function getActiveCustomModelConfig() {
            return normalizeCustomConfig(getStoredCustomModelConfig(), true);
        }

        function getAllProviderConfigs() {
            try {
                const registry = ensureAIProvidersRegistry();
                if (!registry) {
                    return [];
                }
                return registry.getProviders().map((provider) => normalizeCustomConfig(provider, true)).filter(Boolean);
            } catch (e) {
                console.error('[ZoteroHelper] 读取 provider 列表失败:', e);
                return [];
            }
        }

        function getProviderConfigByName(providerName) {
            try {
                const registry = ensureAIProvidersRegistry();
                if (!registry) {
                    return null;
                }
                return normalizeCustomConfig(registry.getProviderByName(providerName), true);
            } catch (e) {
                console.error('[ZoteroHelper] 读取指定 provider 失败:', e);
                return null;
            }
        }

        function getDefaultProviderName() {
            const provider = getStoredCustomModelConfig();
            return provider?.name || '';
        }

        function getDefaultChatModel() {
            const provider = getActiveCustomModelConfig();
            if (!provider) {
                return null;
            }
            return {
                key: provider.name || provider.modelName,
                label: provider.name || provider.modelName,
                config: provider
            };
        }

        function getProviderMenuItems() {
            return getAllProviderConfigs().map((provider) => ({
                key: provider.name,
                label: provider.name,
                disabled: false
            }));
        }

        function setDefaultProvider(providerName) {
            try {
                const registry = ensureAIProvidersRegistry();
                if (!registry) {
                    return false;
                }
                return !!registry.setDefaultProvider(providerName);
            } catch (e) {
                console.error('[ZoteroHelper] 设置默认 provider 失败:', e);
                return false;
            }
        }

        function formatCustomEndpoint(baseUrl) {
            let url = String(baseUrl || '').trim().replace(/\/+$/, '');
            if (!url) {
                throw new Error('自定义 AI 提供商 baseUrl 为空');
            }
            if (url.endsWith('/chat/completions')) {
                return url;
            }
            if (/\/v\d+$/.test(url)) {
                return `${url}/chat/completions`;
            }
            if (/\/v\d+\//.test(url)) {
                return url.replace(/(\/v\d+\/).*$/, '$1chat/completions');
            }
            return `${url}/v1/chat/completions`;
        }

        function saveProviderConfig(config, options = {}) {
            try {
                const Zotero = getHostZotero();
                const normalized = normalizeCustomConfig(config, true);
                const registry = ensureAIProvidersRegistry();
                if (!Zotero || !Zotero.Prefs || !registry || !normalized) {
                    return false;
                }
                const providerName = String(normalized.name || DEFAULT_PROVIDER_NAME).trim() || DEFAULT_PROVIDER_NAME;
                const providers = getAllProviderConfigs().filter((provider) => provider.name !== providerName);
                const provider = {
                    name: providerName,
                    baseUrl: normalized.baseUrl,
                    apiKey: normalized.apiKey,
                    modelName: normalized.modelName
                };
                providers.push(provider);
                const defaultProviderName = options.setDefault === false
                    ? getDefaultProviderName() || provider.name
                    : provider.name;
                registry.saveProviders(providers, defaultProviderName);
                Zotero.Prefs.clear(CUSTOM_AUTO_OPEN_PREF, true);
                return true;
            } catch (e) {
                console.error('[ZoteroHelper] 保存自定义模型配置失败:', e);
                return false;
            }
        }

        function saveCustomModelConfig(config) {
            return saveProviderConfig(config, { setDefault: true });
        }

        function deleteProviderConfig(providerName) {
            try {
                const Zotero = getHostZotero();
                const registry = ensureAIProvidersRegistry();
                if (!Zotero || !Zotero.Prefs || !registry) {
                    return false;
                }
                const normalizedName = String(providerName || '').trim();
                const nextProviders = getAllProviderConfigs().filter((provider) => provider.name !== normalizedName);
                const nextDefaultName = getDefaultProviderName() === normalizedName ? nextProviders[0]?.name || '' : getDefaultProviderName();
                registry.saveProviders(nextProviders, nextDefaultName);
                Zotero.Prefs.clear(CUSTOM_AUTO_OPEN_PREF, true);
                return true;
            } catch (e) {
                console.error('[ZoteroHelper] 删除 provider 配置失败:', e);
                return false;
            }
        }

        function clearCustomModelConfig() {
            const defaultProviderName = getDefaultProviderName();
            if (defaultProviderName) {
                return deleteProviderConfig(defaultProviderName);
            }
            return true;
        }

        function shouldAutoOpenCustomProviderDialog() {
            try {
                const Zotero = getHostZotero();
                return !!(Zotero && Zotero.Prefs && Zotero.Prefs.get(CUSTOM_AUTO_OPEN_PREF, true));
            } catch (e) {
                console.error('[ZoteroHelper] 读取 custom provider 自动打开配置失败:', e);
                return false;
            }
        }

        function clearCustomProviderAutoOpenFlag() {
            try {
                const Zotero = getHostZotero();
                if (Zotero && Zotero.Prefs) {
                    Zotero.Prefs.clear(CUSTOM_AUTO_OPEN_PREF, true);
                }
            } catch (e) {
                console.error('[ZoteroHelper] 清除 custom provider 自动打开配置失败:', e);
            }
        }

        function isXAIProvider(config) {
            if (!config) {
                return false;
            }

            const baseUrl = String(config.baseUrl || '').toLowerCase();
            const model = String(config.modelName || config.model || '').toLowerCase();
            return baseUrl.includes('api.x.ai') || model.startsWith('grok');
        }

        function extractProviderMessageText(payload) {
            if (!payload) {
                return '';
            }

            const content = payload?.choices?.[0]?.message?.content ?? payload?.choices?.[0]?.delta?.content ?? payload?.text ?? '';
            if (typeof content === 'string') {
                return content;
            }

            if (Array.isArray(content)) {
                return content.map((part) => {
                    if (typeof part === 'string') {
                        return part;
                    }
                    if (part && typeof part.text === 'string') {
                        return part.text;
                    }
                    return '';
                }).join('').trim();
            }

            return typeof payload === 'string' ? payload : JSON.stringify(payload);
        }

        function createSyntheticStreamResponse(payload) {
            const assistantText = extractProviderMessageText(payload);
            const encoder = new TextEncoder();
            const created = payload?.created || Math.floor(Date.now() / 1000);
            const chunkPayload = {
                id: payload?.id || `custom-provider-${created}`,
                object: 'chat.completion.chunk',
                created,
                model: payload?.model || '',
                choices: [
                    {
                        index: 0,
                        delta: {
                            role: 'assistant',
                            content: assistantText
                        }
                    }
                ]
            };

            const stream = new ReadableStream({
                start(controller) {
                    controller.enqueue(encoder.encode(`data: ${JSON.stringify(chunkPayload)}\n\n`));
                    controller.enqueue(encoder.encode('data: [DONE]\n\n'));
                    controller.close();
                }
            });

            return new Response(stream, {
                status: 200,
                headers: {
                    'Cache-Control': 'no-cache',
                    'Content-Type': 'text/event-stream; charset=utf-8',
                    'X-Vibero-Custom-Bridge': 'synthetic-sse'
                }
            });
        }

        // 提供全局的 Zotero 辅助函数，供 ai-chat bundle 和自定义配置面板使用
        window.ZoteroHelper = {
            getHostZotero,
            getStoredCustomModelConfig,
            getAllProviderConfigs,
            getProviderConfigByName,
            getDefaultProviderName,
            getDefaultChatModel,
            getProviderMenuItems,
            setDefaultProvider,
            saveProviderConfig,
            deleteProviderConfig,
            formatCustomEndpoint,
            saveCustomModelConfig,
            clearCustomModelConfig,
            shouldAutoOpenCustomProviderDialog,
            clearCustomProviderAutoOpenFlag,

            checkLoginStatus: function () {
                return true;
            },

            getUserBalance: async function () {
                return {
                    credits: null,
                    credits_used: 0,
                    aiWorkflowBypass: true
                };
            },

            openLoginPanel: function () {
                return false;
            },

            // 获取 Supabase 配置
            getSupabaseConfig: function () {
                try {
                    const Zotero = getHostZotero();
                    if (Zotero && Zotero.VibeDBSync && Zotero.VibeDBSync.getSupabaseConfig) {
                        return Zotero.VibeDBSync.getSupabaseConfig();
                    }
                } catch (e) {
                    console.error('[ZoteroHelper] 获取配置失败:', e);
                }
                return null;
            },

            // 获取当前生效的自定义 OpenAI 兼容模型配置
            getActiveCustomModelConfig: function () {
                return getActiveCustomModelConfig();
            },

            getCustomModelConfig: function () {
                return getActiveCustomModelConfig();
            }
        };

        (function installCustomAIProviderForwarder() {
            const originalFetch = window.fetch.bind(window);
            const proxyMatchers = [
                'ai-chat-proxy.yuc430060.workers.dev',
                '/functions/v1/ai-chat-proxy'
            ];

            function getForwardHeaders(input, init) {
                return new Headers(init?.headers || (input instanceof Request ? input.headers : undefined));
            }

            function hasForwardMarker(input, init) {
                return getForwardHeaders(input, init).get('X-Vibero-Custom-Forward') === '1';
            }

            function isProxyRequest(input, init) {
                if (hasForwardMarker(input, init)) {
                    return false;
                }

                const url = typeof input === 'string' ? input : input?.url;
                return !!url && proxyMatchers.some((matcher) => url.includes(matcher));
            }

            function isCustomEndpointRequest(input, init, customConfig) {
                if (hasForwardMarker(input, init) || !customConfig) {
                    return false;
                }

                const url = typeof input === 'string' ? input : input?.url;
                if (!url) {
                    return false;
                }

                try {
                    const endpoint = window.ZoteroHelper?.formatCustomEndpoint?.(customConfig.baseUrl) || formatCustomEndpoint(customConfig.baseUrl);
                    return String(url).replace(/\/+$/, '') === endpoint;
                } catch (e) {
                    console.warn('[AIChatHTML] 识别 custom endpoint 失败:', e);
                    return false;
                }
            }

            function getCustomConfig() {
                return window.ZoteroHelper?.getCustomModelConfig?.() || null;
            }

            async function getRequestBody(input, init) {
                if (init && typeof init.body === 'string') {
                    return init.body;
                }
                if (input instanceof Request) {
                    return await input.clone().text();
                }
                return null;
            }

            async function requestCustomProvider(endpoint, body, input, init) {
                return originalFetch(endpoint, {
                    method: init?.method || (input instanceof Request ? input.method : 'POST'),
                    headers: init?.headers,
                    body: JSON.stringify(body),
                    signal: init?.signal || (input instanceof Request ? input.signal : undefined)
                });
            }

            async function forwardCustomRequest(input, init, customConfig, requestBody, endpoint) {
                const headers = getForwardHeaders(input, init);
                headers.set('Content-Type', 'application/json');
                headers.set('Accept', requestBody.stream ? 'text/event-stream, application/json' : 'application/json');
                headers.set('Authorization', `Bearer ${customConfig.apiKey}`);
                headers.set('X-Vibero-Custom-Forward', '1');
                headers.delete('X-API-Provider');

                const forwardedBody = {
                    ...requestBody,
                    model: customConfig.modelName || customConfig.model
                };

                delete forwardedBody.thinking;

                const forwardedInit = {
                    ...init,
                    headers
                };

                if (isXAIProvider(customConfig) && forwardedBody.stream) {
                    const response = await requestCustomProvider(endpoint, { ...forwardedBody, stream: false }, input, forwardedInit);
                    if (!response.ok) {
                        return response;
                    }
                    const payload = await response.json();
                    return createSyntheticStreamResponse(payload);
                }

                if (forwardedBody.stream) {
                    try {
                        const response = await requestCustomProvider(endpoint, forwardedBody, input, forwardedInit);
                        if (response.ok) {
                            return response;
                        }
                    } catch (e) {
                        console.warn('[AIChatHTML] 自定义 provider 流式请求失败，将尝试非流式回退:', e);
                    }

                    const fallbackResponse = await requestCustomProvider(endpoint, { ...forwardedBody, stream: false }, input, forwardedInit);
                    if (!fallbackResponse.ok) {
                        return fallbackResponse;
                    }
                    const payload = await fallbackResponse.json();
                    return createSyntheticStreamResponse(payload);
                }

                return requestCustomProvider(endpoint, forwardedBody, input, forwardedInit);
            }

            window.fetch = async function (input, init) {
                const customConfig = getCustomConfig();
                const shouldForward = customConfig && (isProxyRequest(input, init) || isCustomEndpointRequest(input, init, customConfig));

                if (!shouldForward) {
                    return originalFetch(input, init);
                }

                try {
                    const rawBody = await getRequestBody(input, init);
                    if (!rawBody) {
                        return originalFetch(input, init);
                    }

                    const requestBody = JSON.parse(rawBody);
                    const endpoint = window.ZoteroHelper?.formatCustomEndpoint?.(customConfig.baseUrl) || formatCustomEndpoint(customConfig.baseUrl);
                    console.log('[AIChatHTML] Forwarding AI chat request to custom provider:', endpoint);
                    return await forwardCustomRequest(input, init, customConfig, requestBody, endpoint);
                } catch (e) {
                    console.error('[AIChatHTML] 自定义 AI 提供商转发失败，回退原始代理:', e);
                    return originalFetch(input, init);
                }
            };
        })();

        (function installCustomProviderConfigUI() {
            const state = {
                initialized: false,
                els: null,
                selectedProviderName: ''
            };

            function getConfigLabel(config) {
                if (!config || !config.name || !config.modelName) {
                    return 'Custom Provider';
                }
                return `${config.name} · ${config.modelName}`;
            }

            function truncateText(text, maxLength = 120) {
                const normalized = String(text || '').replace(/\s+/g, ' ').trim();
                if (!normalized) {
                    return '';
                }
                return normalized.length > maxLength ? `${normalized.slice(0, maxLength - 1)}…` : normalized;
            }

            function getProviders() {
                return window.ZoteroHelper?.getAllProviderConfigs?.() || [];
            }

            function getDefaultProviderNameSafe() {
                return window.ZoteroHelper?.getStoredCustomModelConfig?.()?.name || '';
            }

            function getSelectedProvider() {
                if (!state.selectedProviderName) {
                    return null;
                }
                return window.ZoteroHelper?.getProviderConfigByName?.(state.selectedProviderName) || null;
            }

            function setStatus(type, message) {
                if (!state.els) {
                    return;
                }

                state.els.status.dataset.type = type;
                state.els.status.textContent = message || '';
            }

            function readFormConfig() {
                if (!state.els) {
                    return null;
                }

                return normalizeCustomConfig({
                    name: state.els.providerName.value,
                    baseUrl: state.els.baseUrl.value,
                    apiKey: state.els.apiKey.value,
                    modelName: state.els.modelName.value
                }, false);
            }

            function fillForm(config) {
                if (!state.els) {
                    return;
                }

                const normalized = normalizeCustomConfig(config, false) || {
                    name: '',
                    baseUrl: '',
                    apiKey: '',
                    modelName: ''
                };

                state.els.providerName.value = normalized.name || '';
                state.els.baseUrl.value = normalized.baseUrl || '';
                state.els.apiKey.value = normalized.apiKey || '';
                state.els.modelName.value = normalized.modelName || '';
                if (state.els.defaultProvider) {
                    state.els.defaultProvider.checked = !!normalized.name && normalized.name === getDefaultProviderNameSafe();
                }
            }

            function syncProviderSelect(preferredProviderName = '') {
                if (!state.els?.providerSelect) {
                    return;
                }

                const providers = getProviders();
                const defaultProviderName = getDefaultProviderNameSafe();
                const nextSelectedName = preferredProviderName
                    || state.selectedProviderName
                    || defaultProviderName
                    || providers[0]?.name
                    || '';

                state.els.providerSelect.innerHTML = '';

                const blankOption = document.createElement('option');
                blankOption.value = '';
                blankOption.textContent = providers.length ? '新建 Provider…' : '暂无 Provider，请新建';
                state.els.providerSelect.appendChild(blankOption);

                for (const provider of providers) {
                    const option = document.createElement('option');
                    option.value = provider.name;
                    option.textContent = provider.name === defaultProviderName
                        ? `${provider.name} (默认)`
                        : provider.name;
                    state.els.providerSelect.appendChild(option);
                }

                state.selectedProviderName = providers.some((provider) => provider.name === nextSelectedName)
                    ? nextSelectedName
                    : '';
                state.els.providerSelect.value = state.selectedProviderName;
            }

            function refreshTriggerLabel() {
                if (!state.els) {
                    return;
                }

                const savedConfig = window.ZoteroHelper?.getStoredCustomModelConfig?.();
                state.els.trigger.textContent = getConfigLabel(savedConfig);
                state.els.trigger.classList.toggle('configured', !!savedConfig);
                state.els.trigger.title = savedConfig
                    ? `当前 Custom Provider: ${savedConfig.name || savedConfig.modelName || '已配置'}`
                    : '打开 Custom Provider 配置';
            }

            function openPanel() {
                if (!state.initialized) {
                    return;
                }

                syncProviderSelect(getDefaultProviderNameSafe());
                fillForm(getSelectedProvider() || window.ZoteroHelper?.getStoredCustomModelConfig?.());
                refreshTriggerLabel();
                setStatus('info', getProviders().length
                    ? '可管理多个 provider。默认 provider 会用于解析流程，Chat 内切换只影响当前会话。'
                    : '填写 OpenAI 兼容接口信息后，可直接保存第一个 provider。');

                state.els.overlay.hidden = false;
                state.els.trigger.classList.add('active');
                window.requestAnimationFrame(() => {
                    state.els.providerName.focus();
                    state.els.providerName.select();
                });
            }

            function closePanel() {
                if (!state.initialized) {
                    return;
                }

                state.els.overlay.hidden = true;
                state.els.trigger.classList.remove('active');
            }

            function parseAssistantText(payload) {
                if (!payload) {
                    return '';
                }

                if (typeof payload === 'string') {
                    return payload;
                }

                if (payload.choices && payload.choices[0]) {
                    const choice = payload.choices[0];
                    if (choice.message && typeof choice.message.content === 'string') {
                        return choice.message.content;
                    }
                    if (choice.delta && typeof choice.delta.content === 'string') {
                        return choice.delta.content;
                    }
                }

                return JSON.stringify(payload);
            }

            async function directProviderTest(config) {
                const endpoint = window.ZoteroHelper?.formatCustomEndpoint?.(config.baseUrl) || formatCustomEndpoint(config.baseUrl);
                const response = await window.fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.apiKey}`
                    },
                    body: JSON.stringify({
                        model: config.modelName || config.model,
                        stream: false,
                        messages: [
                            {
                                role: 'user',
                                content: 'Ping from Vibero custom provider settings.'
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`直接连接失败 (${response.status}): ${errorText}`);
                }

                const payload = await response.json();
                return truncateText(parseAssistantText(payload));
            }

            async function verifySavedForwarding(config) {
                const response = await window.fetch('https://ai-chat-proxy.yuc430060.workers.dev/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Provider': 'huoshan'
                    },
                    body: JSON.stringify({
                        model: config.modelName || config.model,
                        stream: false,
                        messages: [
                            {
                                role: 'user',
                                content: 'Ping from Vibero custom provider forwarding verification.'
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`保存后验证失败 (${response.status}): ${errorText}`);
                }

                const payload = await response.json();
                return truncateText(parseAssistantText(payload));
            }

            async function handleDirectTest() {
                const config = normalizeCustomConfig(readFormConfig(), true);
                if (!config) {
                    setStatus('error', '请先填写完整的 Provider 名称、Base URL、API Key 和模型名称。');
                    return;
                }

                setStatus('pending', '正在直接测试 custom provider...');
                try {
                    const summary = await directProviderTest(config);
                    setStatus('success', `直接连接成功：${summary || '返回成功'}`);
                } catch (e) {
                    console.error('[AIChatHTML] Direct custom provider test failed:', e);
                    setStatus('error', e.message || '直接连接失败');
                }
            }

            async function handleSave() {
                const config = normalizeCustomConfig(readFormConfig(), true);
                if (!config) {
                    setStatus('error', '请先填写完整的 Provider 名称、Base URL、API Key 和模型名称。');
                    return;
                }

                const setDefault = !getProviders().length || !!state.els.defaultProvider?.checked;
                if (!window.ZoteroHelper?.saveProviderConfig?.(config, { setDefault })) {
                    setStatus('error', '保存配置失败，请检查 Prefs 是否可写。');
                    return;
                }

                state.selectedProviderName = config.name;
                syncProviderSelect(config.name);
                fillForm(window.ZoteroHelper?.getProviderConfigByName?.(config.name) || config);
                refreshTriggerLabel();
                setStatus('pending', setDefault
                    ? '配置已保存，正在验证默认 provider 的请求转发...'
                    : '配置已保存，正在验证当前 provider 的直连可用性...');

                try {
                    const summary = setDefault
                        ? await verifySavedForwarding(config)
                        : await directProviderTest(config);
                    setStatus('success', setDefault
                        ? `配置已保存并验证通过：${summary || '转发成功'}`
                        : `Provider 已保存并通过直连验证：${summary || '连接成功'}`);
                    window.dispatchEvent(new CustomEvent('vibero-custom-provider-config-updated', { detail: config }));
                } catch (e) {
                    console.error('[AIChatHTML] Saved custom provider verification failed:', e);
                    setStatus('error', setDefault
                        ? `配置已保存，但转发验证失败：${e.message || '未知错误'}`
                        : `配置已保存，但直连验证失败：${e.message || '未知错误'}`);
                }
            }

            function handleClear() {
                const providerName = state.selectedProviderName || readFormConfig()?.name;
                if (!providerName || !window.ZoteroHelper?.deleteProviderConfig?.(providerName)) {
                    setStatus('error', '删除 provider 失败，请稍后重试。');
                    return;
                }

                const nextDefaultProviderName = getDefaultProviderNameSafe();
                state.selectedProviderName = nextDefaultProviderName;
                syncProviderSelect(nextDefaultProviderName);
                fillForm(getSelectedProvider());
                refreshTriggerLabel();
                setStatus('info', `已删除 provider「${providerName}」。`);
                window.dispatchEvent(new CustomEvent('vibero-custom-provider-config-cleared'));
            }

                if (!window.ZoteroHelper?.setDefaultProvider?.(providerName)) {

                syncProviderSelect(providerName);

                        closePanel();

                    return;

                if (!state.els || state.els.overlay.hidden) {
                    return;

                if (event.key === 'Escape') {

                if (useCommand && event.shiftKey && event.key.toLowerCase() === 't') {

            color: #374151;
        }

        .vibero-custom-provider-checkbox input {
            width: 16px;
            height: 16px;
        }

        .vibero-custom-provider-status {
            min-height: 42px;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid transparent;
        }

        .vibero-custom-provider-status[data-type="info"] {
            background: #f3f4f6;
            color: #374151;
            border-color: #e5e7eb;
        }

        .vibero-custom-provider-status[data-type="pending"] {
            background: #eff6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
        }

        .vibero-custom-provider-status[data-type="success"] {
            background: #ecfdf5;
            color: #047857;
            border-color: #a7f3d0;
        }

        .vibero-custom-provider-status[data-type="error"] {
            background: #fef2f2;
            color: #b91c1c;
            border-color: #fecaca;
        }

        .vibero-custom-provider-shortcuts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            font-size: 12px;
            color: #6b7280;
        }

        .vibero-custom-provider-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 20px 20px;
        }

        .vibero-custom-provider-actions-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vibero-custom-provider-actions button {
            min-height: 38px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: #111827;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .vibero-custom-provider-actions button.secondary:hover {
            background: #f9fafb;
        }

        .vibero-custom-provider-actions button.primary {
            border-color: #111827;
            background: #111827;
            color: #ffffff;
        }

        .vibero-custom-provider-actions button.primary:hover {
            background: #1f2937;
        }

        /* 加载动画 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
            font-size: 14px;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60%,
            100% {
                content: '...';
            }
        }
    </style>
</head>

<body>
    <div id="root">
        <div class="loading">Loading AI Chat</div>
    </div>

    <!-- Webpack 构建后的 JS -->
    <script src="ai-chat/ai-chat-bundle.js"
        onerror="console.error('[AIChatHTML] ❌ Failed to load ai-chat-bundle.js')"></script>

    <script>
        window.addEventListener('error', (e) => {
            console.error('='.repeat(80));
            console.error('[AIChatHTML] ❌ Global error:', e.message);
            console.error('[AIChatHTML] Error source:', e.filename);
            console.error('[AIChatHTML] Error line:', e.lineno);
            console.error('='.repeat(80));
        });
    </script>
</body>

</html>
