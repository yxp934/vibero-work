<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Pane</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        #root {
            width: 100%;
            height: 100%;
        }
        
        /* 加载动画 */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
            font-size: 14px;
        }
        
        .loading-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">
            <div class="loading-icon">⚙️</div>
            <div>Loading Code Pane...</div>
        </div>
    </div>
    
    <!-- Webpack 构建后的 JS -->
    <script src="code-pane/code-pane-bundle.js" onerror="console.error('[CodePaneHTML] ❌ Failed to load code-pane-bundle.js')" onload="console.log('[CodePaneHTML] ✓ code-pane-bundle.js loaded successfully')"></script>
    
    <script>
        window.addEventListener('error', (e) => {
            console.error('[CodePaneHTML] ❌ Global error:', e.message);
            console.error('[CodePaneHTML] Error source:', e.filename);
        });
    </script>
</body>
</html>
